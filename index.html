<style>

:root{

button{font:inherit;cursor:pointer;border:0;color:#2a1600;font-weight:600;padding:12px 26px;border-radius:999px;

let AC=null, master=null, soundOn=true, noiseBuf=null, musicTimer=null;
try{ if(localStorage.getItem("snd")==="0") soundOn=false; }catch(e){}
function initAudio(){
  if(AC){ if(AC.state==="suspended") AC.resume(); return; }
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  AC=new C(); master=AC.createGain(); master.gain.value=soundOn?1:0;
  const comp=AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);

  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;

function noise(t0,dur,{type="bandpass",f=1000,f2=null,q=1,g=.5,attack=.002}={}){
  if(!AC) return; const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;

}
function tone(t0,dur,{type="sine",f=440,f2=null,g=.3,attack=.005}={}){

  o.connect(gn); gn.connect(master); o.start(t0); o.stop(t0+dur+.05);
}

(function(){
  const c=$("#rg"),x=c.getContext("2d"),W=c.width,cx=W/2,cy=W/2;
  const pal=["#ff4d6d","#ffb703","#fb8500","#06d6a0","#4cc9f0","#c77dff","#fff1c4"];
  let items=[],idx=0,run=false;
  function build(){
    items=[]; const N=12, rings=[];
    for(let k=0;k<7;k++) rings.push({r:.1+k*.12,n:N*(k<3?1:2),size:.03+(k%3)*.012,col:pal[k%pal.length],petal:k%2===0});
    rings.forEach((g,k)=>{ for(let i=0;i<g.n;i++) items.push({a:i/g.n*Math.PI*2+(k%2)*Math.PI/g.n,...g}); });
    for(let i=0;i<N*2;i++) items.push({a:i/(N*2)*Math.PI*2,r:.93,n:0,size:.018,col:"#fff1c4",petal:false});
    items.sort((p,q)=>p.r-q.r);
  }
  function draw(it){
    const R=W/2*.9, px=cx+Math.cos(it.a)*it.r*R, py=cy+Math.sin(it.a)*it.r*R, s=it.size*W;
    x.save(); x.translate(px,py); x.rotate(it.a); x.fillStyle=it.col; x.shadowColor=it.col; x.shadowBlur=10;

    if(run) return; initAudio(); x.clearRect(0,0,W,W); build(); idx=0; run=true; rbt.disabled=true; rState="rMaking"; paintStatic(); play("rangoli");

  };
})();

    if(BOMB[def.k]){
      const F=FUSE[def.k],g=geo();
      if(t<F){ const u=1-t/F,tx=g.cx+(g.tipx-g.cx)*u*.9,ty=g.top+(g.tipy-g.top)*u; add({x:tx,y:ty,vx:rnd(-1.2,1.2)*d,vy:-rnd(.5,2.5)*d,g:.05*d,decay:.06,r:rnd(1,2.2)*d,heat:1}); if(t%5===0) smoke(tx,ty,1,.3); }
      if(t===F+2){ gone=true; const cy=g.top+g.bh/2; explode(g.cx,cy,def.k==="at"?170:80,def.k==="at"?2:1); if(def.k==="lb") E.second=t+22; bang(def.k==="at"); }
      if(def.k==="lb"&&E.second&&t===E.second){ const cy=g.top+g.bh/2; explode(g.cx,cy,80,1); bang(false); }
    }
  }
  const FUSE={su:70,lb:70,at:110},DUR={sp:200,fo:210,ch:190,ro:110,fw:290,tk:170,su:140,lb:160,at:230};
  function frame(){
    x.globalCompositeOperation="source-over";
    x.fillStyle="rgba(7,4,11,.24)"; x.fillRect(0,0,W(),H());
    if(BOMB[def.k]&&!gone) drawBomb();
    if(def.k==="tk"&&!(active&&E.t>DUR.tk-40)) drawRoll();
    sprites();
    if(active){ emit(E.t); E.t++; if(E.t>DUR[def.k]){ active=false; gone=false; E={t:0}; btn.disabled=false; } }
    const smokes=[],sparks=[];
    for(let i=P.length-1;i>=0;i--){const p=P[i]; p.px=p.x; p.py=p.y; p.vx*=p.drag; p.vy*=p.drag; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay; if(p.smoke) p.r+=p.grow;
      if(p.split&&p.life<.65){ for(let k=0;k<5;k++){const a=Math.random()*6.28,v=rnd(1,3)*d; add({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.05*d,decay:.02,r:1.5*d,col:p.col,tw:1});} P.splice(i,1); continue; }
      if(p.life<=0){P.splice(i,1);continue;} (p.smoke?smokes:sparks).push(p);}
    smokes.forEach(p=>{x.globalAlpha=p.life*.16; x.fillStyle="#7a7a88"; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill();});
    x.globalCompositeOperation="lighter"; x.lineCap="round";
    if(glow>.02){ const R=W()*.45,gr=x.createRadialGradient(gx,gy,0,gx,gy,R); gr.addColorStop(0,`rgba(${gc},${glow*.45})`); gr.addColorStop(1,`rgba(${gc},0)`); x.globalAlpha=1; x.fillStyle=gr; x.fillRect(0,0,W(),H()); glow*=.9; }
    sparks.forEach(p=>{const col=p.heat?heat(p.life):p.col; x.globalAlpha=Math.max(p.life,0)*(p.tw?.55+.45*Math.random():1); x.strokeStyle=col; x.lineWidth=p.r*1.3; x.beginPath(); x.moveTo(p.px,p.py); x.lineTo(p.x,p.y); x.stroke(); x.fillStyle=col; x.beginPath(); x.arc(p.x,p.y,p.r*.8,0,7); x.fill();});
    x.globalAlpha=1; x.globalCompositeOperation="source-over";
    requestAnimationFrame(frame);
  }
  btn.onclick=()=>{ if(active) return; initAudio(); active=true; gone=false; btn.disabled=true; E={t:0}; play(def.k); };
  frame();
}
CK.forEach(makeCard);

function paintStatic(){

  sb.textContent=soundOn?tx("on"):tx("off"); sb.setAttribute("aria-pressed",soundOn);
  dl.textContent=$$(".diya.on").length===6?tx("dlOff"):tx("dlOn");
  rbt.textContent=tx(rState);
  $("#pm").textContent=tx("pm"+pStep);
  $$(".card").forEach(el=>{const {def,idx}=el._ck; $("h3",el).textContent=tx("n")[idx]; $("p",el).textContent=LANG==="en"?TXT.hi.n[idx]:TXT.en.n[idx]; $("button",el).textContent=tx(def.b);});
  $$(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  document.documentElement.lang=LANG;
}
$$(".langs button").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang; try{localStorage.setItem("lang",LANG)}catch(e){} paintStatic();});
